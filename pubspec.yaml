name: grand_frere_vendor
description: Grand Frère — Vendor app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # DI
  get_it: ^7.7.0

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0

  # Functional programming
  fpdart: ^1.1.0

  # Environment
  flutter_dotenv: ^5.2.1

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # QR scanner
  mobile_scanner: ^7.2.0

  # Image picker (upload photo article)
  image_picker: ^1.1.2

  # Fonts
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env.staging
    - .env.production
    - assets/logo.png
    - assets/wave_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  remove_alpha_ios: true
